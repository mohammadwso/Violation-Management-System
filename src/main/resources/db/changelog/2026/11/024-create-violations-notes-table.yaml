databaseChangeLog:
  - changeSet:
      author: mohammadwso
      id: 024-create-violations-notes-table
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: violation_notes
      changes:
        - createTable:
            tableName: violation_notes
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: violation_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: violation_note
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: fk_violation_notes_violation
            baseTableName: violation_notes
            baseColumnNames: violation_id
            referencedTableName: violations
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_violation_notes_user
            baseTableName: violation_notes
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
        - createIndex:
            indexName: idx_violation_notes_violation
            tableName: violation_notes
            columns:
              - column: { name: violation_id }
        - createIndex:
            indexName: idx_violation_notes_user
            tableName: violation_notes
            columns:
              - column: { name: user_id }

      rollback:
        - dropTable:
            tableName: violation_notes