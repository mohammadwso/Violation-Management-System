databaseChangeLog:
  - changeSet:
      id: 021-create-ref-source
      author: mohammadwso
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: ref_source
      changes:
        - createTable:
            tableName: ref_source
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: code
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_ref_source_code
              - column:
                  name: name_ar
                  type: NVARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_ref_source_name_ar
              - column:
                  name: name_en
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_ref_source_name_en
              - column:
                  name: created_at
                  type: DATETIME2
                  defaultValueComputed: SYSUTCDATETIME()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: DATETIME2
                  defaultValueComputed: SYSUTCDATETIME()
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: ref_source
