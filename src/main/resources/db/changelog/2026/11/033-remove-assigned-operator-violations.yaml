databaseChangeLog:
  - changeSet:
      id: 033-remove-assigned-operator-violations
      author: mohammadwso
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            tableName: violations
            columnName: assigned_operator_id
        - columnExists:
            tableName: violations
            columnName: assigned_at
      changes:
        - dropForeignKeyConstraint:
            constraintName: fk_violations_assigned_operator
            baseTableName: violations
        - dropIndex:
            tableName: violations
            indexName: idx_violations_operator_status
        - dropIndex:
            tableName: violations
            indexName: idx_violations_status_assigned_at
        - dropColumn:
            tableName: violations
            columnName: assigned_operator_id
        - dropColumn:
            tableName: violations
            columnName: assigned_at
      rollback:
        - addColumn:
            tableName: violations
            columns:
              - column: { name: assigned_operator_id, type: BIGINT }
              - column: { name: assigned_at, type: DATETIME2 }
        - sql:
            sql: >
              UPDATE v
              SET v.assigned_operator_id = h.operator_id,
                  v.assigned_at          = h.assigned_at
              FROM violations v
              JOIN violation_assignment_history h ON h.id = v.current_assignment_id
              WHERE h.ended_at IS NULL
        - addForeignKeyConstraint:
            constraintName: fk_violations_assigned_operator
            baseTableName: violations
            baseColumnNames: assigned_operator_id
            referencedTableName: users
            referencedColumnNames: id
        - createIndex:
            indexName: idx_violations_operator_status
            tableName: violations
            columns:
              - column: { name: assigned_operator_id }
              - column: { name: status_id }
        - createIndex:
            indexName: idx_violations_status_assigned_at
            tableName: violations
            columns:
              - column: { name: status_id }
              - column: { name: assigned_at }