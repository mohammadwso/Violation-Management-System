databaseChangeLog:
  - changeSet:
      id: 017-create-ref-status
      author: mohammadwso
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: ref_status
      changes:
        - createTable:
            tableName: ref_status
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: code
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_ref_status_code
              - column:
                  name: name_ar
                  type: NVARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_ref_status_name_ar
              - column:
                  name: name_en
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_ref_status_name_en
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: ref_status